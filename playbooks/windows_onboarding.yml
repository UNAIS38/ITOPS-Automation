---
- name: Windows Employee Onboarding
  hosts: all
  gather_facts: false

  tasks:

    - name: Test Windows connectivity
      ansible.windows.win_ping:

    - name: Create Company folder
      ansible.windows.win_file:
        path: C:\Company
        state: directory

    - name: Create Welcome file
      ansible.windows.win_copy:
        dest: C:\Company\Welcome.txt
        content: |
          Welcome to the Company

          Employee Name : {{ employee_name }}
          Employee ID   : {{ employee_id }}
          Department    : {{ department }}
          Windows User  : {{ windows_username }}

          This laptop was configured automatically using
          Ansible AWX Automation.

          IT Team

    - name: Create Windows login user
      ansible.windows.win_user:
        name: "{{ windows_username }}"
        fullname: "{{ employee_name }}"
        description: "{{ department }} Employee"
        password: "{{ windows_password }}"
        state: present
        account_disabled: false
        password_never_expires: true
        user_cannot_change_password: false
        groups:
          - Users
        groups_action: add
      no_log: true
      when: create_windows_user | default(false) | bool

    - name: Verify Windows user
      ansible.windows.win_powershell:
        script: |
          Get-LocalUser "{{ windows_username }}"
      when: create_windows_user | default(false) | bool

    - name: Install Google Chrome
      ansible.windows.win_powershell:
        script: |

          $Chrome64="C:\Program Files\Google\Chrome\Application\chrome.exe"
          $Chrome32="C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"

          if((Test-Path $Chrome64) -or (Test-Path $Chrome32))
          {
              Write-Host "Chrome already installed"
              exit 0
          }

          $Installer="$env:TEMP\ChromeSetup.exe"

          Invoke-WebRequest `
          -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
          -OutFile $Installer

          Start-Process `
          $Installer `
          -ArgumentList "/silent","/install" `
          -Wait

          Remove-Item $Installer -Force

      when: "'Google Chrome' in selected_applications"

    - name: Windows Update Search
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
          - UpdateRollups
        state: searched
      register: windows_update_result
      when: "'Windows Update' in selected_applications"

    - name: Show Windows Update Result
      ansible.builtin.debug:
        msg:
          - "Updates Found : {{ windows_update_result.found_update_count | default(0) }}"
          - "Restart Required : {{ windows_update_result.reboot_required | default(false) }}"
      when: "'Windows Update' in selected_applications"

    - name: Bitdefender
      ansible.builtin.debug:
        msg: "Bitdefender installer not configured yet."
      when: "'Bitdefender' in selected_applications"

    - name: Scalefusion
      ansible.builtin.debug:
        msg: "Scalefusion installer not configured yet."
      when: "'Scalefusion' in selected_applications"

    - name: Restart Windows
      ansible.windows.win_reboot:
        reboot_timeout: 1800
        post_reboot_delay: 60
      when: restart_computer | bool

    - name: Completion Message
      ansible.builtin.debug:
        msg:
          - "=================================="
          - "Windows Onboarding Completed"
          - "Employee : {{ employee_name }}"
          - "Laptop   : {{ inventory_hostname }}"
          - "User     : {{ windows_username }}"
          - "=================================="
